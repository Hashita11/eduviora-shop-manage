<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduviora Admin Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center fw-bold text-primary mb-4">👑 Eduviora Shop Manager - Admin Panel</h2>
        
        <!-- Add / Renew Shop Card -->
        <div class="card p-4 shadow-sm rounded-4 border-0 mb-4 bg-white">
            <h5 class="fw-bold mb-3 text-success">➕ Extend / Register Shop License</h5>
            <div class="mb-3">
                <label class="form-label fw-bold">Shop Name / ID:</label>
                <input type="text" id="adminShopName" class="form-control" placeholder="ఉదాహరణకు: Sri Venkateswara General Store">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Select Plan / Days to Extend:</label>
                <select id="adminPlanDays" class="form-select">
                    <option value="7">7 Days Trial (ఫ్రీ ట్రయల్)</option>
                    <option value="30">1 Month Plan - ₹199 (నెలవారీ)</option>
                    <option value="365">1 Year Plan - ₹1,999 (వార్షిక)</option>
                </select>
            </div>
            <button class="btn btn-success fw-bold w-100 py-2" onclick="generateLicenseKey()">Generate & Activate License</button>
        </div>

        <!-- Result / Output Key -->
        <div id="resultBox" class="card p-3 shadow-sm rounded-4 border-0 bg-white d-none">
            <h6 class="fw-bold text-dark">📋 Generated License Details:</h6>
            <p id="outputDetails" class="text-muted small mb-2"></p>
            <textarea id="outputJson" class="form-control font-monospace small" rows="3" readonly></textarea>
            <p class="text-success small mt-2 mb-0">👉 ఈ కోడ్‌ను కాపీ చేసి షాప్ ఓనర్‌కి వాట్సాప్‌లో పంపండి లేదా వారి మొబైల్‌లో సెట్ చేయండి.</p>
        </div>

    </div>

    <script>
        function generateLicenseKey() {
            let shopName = document.getElementById('adminShopName').value;
            let days = parseInt(document.getElementById('adminPlanDays').value);

            if(!shopName) {
                alert('దయచేసి షాప్ పేరు ఎంటర్ చేయండి.');
                return;
            }

            // గడువు తేదీ లెక్కించడం
            let expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + days);
            let expiryStr = expiryDate.toISOString().split('T')[0];

            let licenseObj = {
                shopName: shopName,
                expiryDate: expiryStr,
                status: "ACTIVE"
            };

            let jsonString = JSON.stringify(licenseObj);

            // రిజల్ట్ చూపించడం
            document.getElementById('resultBox').classList.remove('d-none');
            document.getElementById('outputDetails').innerHTML = `<b>Shop:</b> ${shopName} <br><b>Valid Till:</b> ${expiryStr}`;
            document.getElementById('outputJson').value = `localStorage.setItem('eduviora_license', '${jsonString}'); location.reload();`;
        }
    </script>
</body>
</html>
